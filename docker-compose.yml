# Inicia todo con:   docker compose up -d --build
# Luego abre:        http://localhost:8000
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inventory}
      TZ: ${TZ:-America/Caracas}
    volumes:
      # Los datos quedan guardados en este equipo, en un volumen de Docker
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Respaldo automático de la base de datos: cada día a BACKUP_TIME guarda una copia en BACKUP_DIR
  # y conserva solo las últimas BACKUP_KEEP (ver README, sección "Respaldos").
  backup:
    build: ./backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: inventory_db
      PGUSER: inventory
      PGPASSWORD: ${DB_PASSWORD:-inventory}
      BACKUP_TIME: ${BACKUP_TIME:-18:30}
      BACKUP_KEEP: ${BACKUP_KEEP:-20}
      TZ: ${TZ:-America/Caracas}
    volumes:
      # Carpeta del equipo donde quedan las copias. En Windows, por ejemplo: BACKUP_DIR=C:/Respaldos
      - ${BACKUP_DIR:-./respaldos}:/respaldos

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://inventory:${DB_PASSWORD:-inventory}@db:5432/inventory_db
      SECRET_KEY: ${SECRET_KEY:-}
      TZ: ${TZ:-America/Caracas}
    ports:
      # Puerto en el que se abre la aplicación (http://localhost:8000)
      - "${APP_PORT:-8000}:8000"

volumes:
  db_data:
